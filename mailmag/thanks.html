<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登録ありがとうございます｜たすかるエアコンお掃除専門店</title>
<style>
  :root { --brand:#00a5d4; --brand-sub:#45b0e3; --ink:#313131; --muted:#5b6b74; --line:#cfe6f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; color:var(--ink); background:#f7fbfd; line-height:1.7; }
  .wrap { max-width:640px; margin:0 auto; padding:40px 16px 48px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px 22px; text-align:center; box-shadow:0 2px 10px rgba(0,120,170,.06); }
  h1 { font-size:23px; margin:0 0 12px; color:var(--brand); }
  p { font-size:15px; }
  .note { color:var(--muted); font-size:13px; margin-top:16px; text-align:left; }
  a.btn { display:inline-block; margin-top:20px; padding:13px 28px; border-radius:999px; background:var(--brand); color:#fff; font-size:16px; font-weight:700; text-decoration:none; }
  a.btn:hover { background:var(--brand-sub); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ご登録ありがとうございます</h1>
    <p>メールマガジンの登録を受け付けました。<br>確認のため、ご登録のアドレスへメールをお送りしています。</p>
    <p>次回の配信をお待ちください。</p>
    <a class="btn" href="https://tasukaruaircon.net/">公式サイトへ戻る</a>
    <p class="note">確認メールが届かない場合は、迷惑メールフォルダをご確認ください。それでも届かないときは、公式サイトのお問い合わせフォームからご連絡ください。</p>
  </div>
</div>
</body>
</html>
